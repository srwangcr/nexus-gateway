version: '3.8'

services:
  gateway:
    build: .
    container_name: nexus-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=3000
      - JWT_SECRET=${JWT_SECRET} # Debes definir esto en un archivo .env
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD} # Opcional, si Redis lo requiere
    depends_on:
      - redis
    networks:
      - nexus-net

  redis:
    image: "redis:7-alpine"
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge

volumes:
  redis-data:
    driver: local