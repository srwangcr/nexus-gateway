version: '3.8'

services:
  gateway:
    build: .
    container_name: nexus-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=3000
      - JWT_SECRET=${JWT_SECRET} # Debes definir esto en un archivo .env
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD} # Opcional, si Redis lo requiere
    depends_on:
      - redis
    networks:
      - nexus-net

  redis:
    image: "redis:7-alpine"
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - nexus-net

  users-service:
    image: node:18-alpine
    container_name: users-service
    command: sh -c "npm init -y && npm install express && node -e \"const express = require('express'); const app = express(); app.get('/api/users', (req, res) => res.json({ok:true, users:[]})); app.listen(3001);\""
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge

volumes:
  redis-data:
    driver: local